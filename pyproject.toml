[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "margem-real"
version = "0.2.0"
description = "Preço mínimo e sugerido por SKU e canal, com margem de contribuição em SQL (DuckDB). Dados 100% sintéticos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andressa Cunha de Oliveira" }]
dependencies = [
  "pandas>=2.3",
  "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
margem_real = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
