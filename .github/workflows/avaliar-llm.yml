name: avaliar-llm
# Roda SOMENTE sob demanda (Actions > avaliar-llm > Run workflow). Não roda em push nem em PR,
# porque cada execução gasta créditos da API. Exige o secret ANTHROPIC_API_KEY no repositório.
on:
  workflow_dispatch:
    inputs:
      modelo:
        description: "ID do modelo (ex.: claude-sonnet-5-5)"
        required: true
        default: "claude-sonnet-5-5"
      trials:
        description: "Trials por tarefa (n); custo cresce linearmente"
        required: true
        default: "3"
      split:
        description: "dev | heldout | todos"
        required: true
        default: "heldout"
permissions:
  contents: read
concurrency:
  group: avaliar-llm
  cancel-in-progress: false
jobs:
  avaliar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Checa que a chave existe (sem exibi-la)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Secret ANTHROPIC_API_KEY não configurado em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Avalia o agente com o LLM
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELO: ${{ inputs.modelo }}
          TRIALS: ${{ inputs.trials }}
          SPLIT: ${{ inputs.split }}
        run: python -m margem_real.agent.evals --llm-modelo "$MODELO" --trials "$TRIALS" --split "$SPLIT" --saida evals
      - name: Resumo na página da execução
        run: |
          for f in evals/llm/*/RELATORIO.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v6
        with:
          name: avaliacao-llm
          path: evals/llm/
