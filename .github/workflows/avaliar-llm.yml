name: avaliar-llm
# Roda SOMENTE sob demanda (Actions > avaliar-llm > Run workflow). Não roda em push nem em PR.
# provedor=gemini: plano gratuito do Google; exige o secret GEMINI_API_KEY (chave do AI Studio).
# provedor=anthropic: pago; exige o secret ANTHROPIC_API_KEY.
# (O GitHub Models, tentado antes, não responde mais: ver docs/AVALIACAO.md.)
on:
  workflow_dispatch:
    inputs:
      provedor:
        description: "gemini (plano gratuito) | anthropic (pago)"
        required: true
        default: "gemini"
      modelo:
        description: "ID do modelo (gemini: veja aistudio.google.com; anthropic: ex. claude-sonnet-5-5)"
        required: true
        default: "gemini-3.8-flash"
      trials:
        description: "Trials por tarefa (n); custo/cota cresce linearmente"
        required: true
        default: "1"
      split:
        description: "dev | heldout | todos"
        required: true
        default: "heldout"
permissions:
  contents: read
concurrency:
  group: avaliar-llm
  cancel-in-progress: false
jobs:
  avaliar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Checa a credencial do provedor (sem exibi-la)
        env:
          PROVEDOR: ${{ inputs.provedor }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$PROVEDOR" = "anthropic" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Secret ANTHROPIC_API_KEY não configurado (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "$PROVEDOR" = "gemini" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Secret GEMINI_API_KEY não configurado (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Sonda rápida do Gemini (1 chamada curta, falha cedo)
        if: inputs.provedor == 'gemini'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELO: ${{ inputs.modelo }}
        run: |
          python - <<'PY' 2> sonda.log || { echo "::error::sonda: $(tail -n 1 sonda.log)"; exit 1; }
          import os, time
          from margem_real.agent.llm_chat import cliente_chat_http, URL_GEMINI
          c = cliente_chat_http(URL_GEMINI, os.environ["GEMINI_API_KEY"], tentativas=1, timeout=45)
          t = time.monotonic()
          r = c({"model": os.environ["MODELO"], "max_tokens": 16,
                 "messages": [{"role": "user", "content": "responda: ok"}]})
          print("sonda ok em", round(time.monotonic() - t, 1), "s;", str(r)[:200])
          PY
      - name: Avalia o agente com o LLM
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVEDOR: ${{ inputs.provedor }}
          MODELO: ${{ inputs.modelo }}
          TRIALS: ${{ inputs.trials }}
          SPLIT: ${{ inputs.split }}
        run: |
          python -m margem_real.agent.evals --provedor "$PROVEDOR" --llm-modelo "$MODELO" \
            --trials "$TRIALS" --split "$SPLIT" --saida evals 2> erro.log || {
            echo "::error::$(tail -n 1 erro.log)"
            exit 1
          }
      - name: Resumo na página da execução
        if: always()
        run: |
          for f in evals/llm/*/RELATORIO.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done; true
      - name: Relatório também como anotação (legível sem baixar o artefato)
        if: always()
        run: |
          for f in evals/llm/*/RELATORIO.md; do
            [ -f "$f" ] || continue
            msg=$(cat "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::notice title=Relatório da avaliação::$msg"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: avaliacao-llm
          path: evals/llm/
          if-no-files-found: ignore
