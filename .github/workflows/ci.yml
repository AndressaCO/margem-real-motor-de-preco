name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q --cov=margem_real --cov-fail-under=95
  reproducibilidade:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instala as versões fixadas no lock file
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Relatório de referência é reproduzível (mesma semente, mesmas versões)
        run: |
          python -m margem_real --saida "$RUNNER_TEMP/r.md" --csv "$RUNNER_TEMP/m.csv" > /dev/null
          for par in "reports/relatorio.md:r.md" "reports/margem_por_sku_canal.csv:m.csv"; do
            ref="${par%%:*}"; novo="$RUNNER_TEMP/${par##*:}"
            if ! diff -q "$ref" "$novo" > /dev/null; then
              resumo=$(diff "$ref" "$novo" | head -6 | tr '\n' '|')
              echo "::error title=Divergência em $ref::python=$(python -V) pandas/numpy/duckdb=$(pip list 2>/dev/null | grep -iE '^(pandas|numpy|duckdb) ' | tr -s ' ' | tr '\n' ',') diff=$resumo"
              exit 1
            fi
          done
      - name: Demonstração do pipeline (idempotência e bloqueio de lote ruim)
        run: python -m margem_real.pipeline --skus 100 --json "$RUNNER_TEMP/pipeline.json" > /dev/null
      - name: Avaliação do agente (portão de regressão no conjunto dev)
        run: |
          python -m margem_real.agent.evals --trials 3 --saida "$RUNNER_TEMP/evals" > /dev/null
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/evals/resultados.json"))
          dev = r["planejadores"]["regras"]["dev"]["metricas"]["pass^k"]["3"]
          assert dev == 1.0, f"regressão: pass^3 dev = {dev}"
          PY
      - name: Auditoria de rubrica
        run: python scripts/auditar.py --rapido
      - uses: actions/upload-artifact@v4
        with:
          name: avaliacao-agente
          path: ${{ runner.temp }}/evals
