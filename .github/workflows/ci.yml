name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q --cov=margem_real --cov-fail-under=95
  reproducibilidade:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Relatório de referência é reproduzível (mesma semente, mesmo resultado)
        run: |
          python -m margem_real --saida "$RUNNER_TEMP/r.md" --csv "$RUNNER_TEMP/m.csv" > /dev/null
          diff reports/relatorio.md "$RUNNER_TEMP/r.md"
          diff reports/margem_por_sku_canal.csv "$RUNNER_TEMP/m.csv"
      - name: Demonstração do pipeline (idempotência e bloqueio de lote ruim)
        run: python -m margem_real.pipeline --skus 100 --json "$RUNNER_TEMP/pipeline.json" > /dev/null
      - name: Avaliação do agente (portão de regressão no conjunto dev)
        run: |
          python -m margem_real.agent.evals --trials 3 --saida "$RUNNER_TEMP/evals" > /dev/null
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/evals/resultados.json"))
          dev = r["planejadores"]["regras"]["dev"]["metricas"]["pass^k"]["3"]
          assert dev == 1.0, f"regressão: pass^3 dev = {dev}"
          PY
      - name: Auditoria de rubrica
        run: python scripts/auditar.py --rapido
      - uses: actions/upload-artifact@v4
        with:
          name: avaliacao-agente
          path: ${{ runner.temp }}/evals
